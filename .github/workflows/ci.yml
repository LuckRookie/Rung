name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run behavior tests
        run: python -B -m unittest discover -s tests -v

      - name: Validate Rung core contract
        run: python rung/scripts/validate_contract.py --skill-root rung

      - name: Check structured Scope Gate evaluator
        run: python rung/scripts/evaluate_scope.py --input tests/scope-classification.json

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.8

      - name: Run Ruff
        run: ruff check --no-cache .
